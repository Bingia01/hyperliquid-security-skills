id: open_interest_growth_exceeds_depth
title: Open interest built in the last hour exceeds what the book can absorb
summary: >-
  New positions opened in the last hour, net of closes, exceed the resting depth
  within 2% on the thinner side of the book, and are large enough to matter.
  JELLY, POPCAT and FARTCOIN each began with an actor opening positions far
  larger than the book; a level-based exposure measure
  (open_interest_exceeds_depth) misses this when the market's standing open
  interest was unremarkable until the day of the attack. The rule reads the
  market total, so splitting the positions across many wallets does not hide
  them.
stage: active_attack
mode: report
severity: high
consumer: HIP-3 deployers, the validator set's risk monitoring, risk analysts
action: >-
  Identify the accounts that opened the new positions (largest recent fills,
  newly funded wallets); check whether longs and shorts trace to one actor; a
  HIP-3 deployer can lower the open interest cap or halt the market before the
  positions are pushed into liquidation.
applies_to: [core_perps, hyperps, hip3_perps]
scope: [market]
detects: [exposure_exceeds_depth]
protects: [loss_containment]
anchors: [hl-2025-03-jelly, hl-2025-11-popcat, hl-2026-04-fartcoin]
thresholds:
  max_growth_to_depth:
    value: 1.0
    unit: ratio
    basis: definitional
    note: >-
      1.0 means the positions opened in the last hour alone could not be closed
      within 2% even by taking all resting depth on the thinner side.
  min_growth_usd:
    value: 250.0e3
    unit: usd
    basis: placeholder
    note: >-
      Materiality, not exposure: below this, even a total loss on the new
      positions is small next to the cost of a person's attention. It is an
      absolute amount on purpose, because that cost does not shrink with the
      market. A share of the backstop's capital was tried first and failed on
      HIP-3, where every dex's backstop held $0-$104k on 2026-10-13, so dust
      markets (para:TTWO, $16k of growth against $286 of depth) consumed the
      alert budget. On the 2026-10-13 two-hour recording, floors from $100k to
      $250k flag the same markets.
condition:
  all:
    - >-
      market.open_interest_change_usd_1h / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
      >= threshold.max_growth_to_depth
    - market.open_interest_change_usd_1h >= threshold.min_growth_usd
report:
  growth_to_thinner_side_depth: market.open_interest_change_usd_1h / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
  growth_usd: market.open_interest_change_usd_1h
false_positives:
  - scenario: News or a listing elsewhere draws real two-sided interest faster than market makers deepen the book.
    distinguisher: Many unrelated accounts, depth rising over the following snapshots, and an external price move that explains the interest.
  - scenario: A market listed within the last hour or two starts from zero open interest and a thin book.
    distinguisher: Market age; compare with how other new listings filled in.
  - scenario: One large trader opens a hedged or directional position that is well collateralized.
    distinguisher: Leverage and margin of the new positions; a low-leverage position far from liquidation cannot be pushed onto the backstop cheaply.
limitations:
  - The change is net. Positions opened while others close are partly hidden, so a build-up during heavy turnover is understated.
  - A build-up spread over more than an hour can stay below the threshold in every window; open_interest_exceeds_depth catches it once the standing exposure is large.
  - No anchor's record states how long the build-up preceded the liquidation, so the lead time this rule gives is unmeasured.
  - Needs a snapshot of the same market taken 55 to 65 minutes earlier (`snapshot --previous`); without one the rule returns unknown.
fixtures:
  - name: an hour's new positions twice the thinner side fire
    expect: fires
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: 2.0e6, market.bid_depth_usd_2pct: 1.5e6, market.ask_depth_usd_2pct: 1.0e6}
  - name: growth a deep book absorbs is silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: 5.0e6, market.bid_depth_usd_2pct: 50.0e6, market.ask_depth_usd_2pct: 60.0e6}
  - name: growth too small to matter is silent however thin the book
    expect: silent
    provenance: synthetic
    surface: hip3_perps
    values: {market.open_interest_change_usd_1h: 16.0e3, market.bid_depth_usd_2pct: 286.0, market.ask_depth_usd_2pct: 900.0}
    note: Fifty-six times the depth, as on para:TTWO on 2026-10-13, but $16k.
  - name: exactly at both thresholds fires
    expect: fires
    provenance: synthetic
    surface: hyperps
    values: {market.open_interest_change_usd_1h: 250.0e3, market.bid_depth_usd_2pct: 250.0e3, market.ask_depth_usd_2pct: 1.0e6}
  - name: falling open interest is silent even with depth unmeasured
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: -3.0e6}
  - name: material growth with depth unmeasured is unknown
    expect: unknown
    provenance: synthetic
    surface: hip3_perps
    values: {market.open_interest_change_usd_1h: 2.0e6, market.ask_depth_usd_2pct: 0.5e6}
  - name: no snapshot an hour earlier is unknown
    expect: unknown
    provenance: synthetic
    surface: core_perps
    values: {market.bid_depth_usd_2pct: 1.0e6, market.ask_depth_usd_2pct: 1.0e6}
  - name: outcome markets have no liquidations
    expect: not_applicable
    provenance: synthetic
    surface: hip4_outcomes
    values: {market.open_interest_change_usd_1h: 2.0e6, market.bid_depth_usd_2pct: 0.1e6, market.ask_depth_usd_2pct: 0.1e6}
