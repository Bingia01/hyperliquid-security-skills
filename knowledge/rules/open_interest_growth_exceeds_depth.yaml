id: open_interest_growth_exceeds_depth
title: Open interest built in the last hour exceeds what the book can absorb
summary: >-
  New positions opened in the last hour, net of closes, exceed the resting depth
  within 2% on the thinner side of the book, and are large relative to the
  capital that would absorb a forced close. JELLY, POPCAT and FARTCOIN each
  began with an actor opening positions far larger than the book; a level-based
  exposure measure (open_interest_exceeds_depth) misses this when the market's
  standing open interest was unremarkable until the day of the attack. The rule
  reads the market total, so splitting the positions across many wallets does
  not hide them.
stage: active_attack
mode: report
severity: high
consumer: HIP-3 deployers, the validator set's risk monitoring, risk analysts
action: >-
  Identify the accounts that opened the new positions (largest recent fills,
  newly funded wallets); check whether longs and shorts trace to one actor; a
  HIP-3 deployer can lower the open interest cap or halt the market before the
  positions are pushed into liquidation.
applies_to: [core_perps, hyperps, hip3_perps]
scope: [market, backstop]
detects: [exposure_exceeds_depth]
protects: [loss_containment]
anchors: [hl-2025-03-jelly, hl-2025-11-popcat, hl-2026-04-fartcoin]
thresholds:
  max_growth_to_depth:
    value: 1.0
    unit: ratio
    basis: definitional
    note: >-
      1.0 means the positions opened in the last hour alone could not be closed
      within 2% even by taking all resting depth on the thinner side. Base rate
      in the 2026-10-13 recording (one hour of comparisons, 06:24-08:21 UTC): with
      both conditions, 3 of 178 validator-operated markets (GRASS, PONS, TIA) and
      5 of 159 HIP-3 markets fired at least once; with this condition alone, 6
      validator-operated markets did, mostly small ones such as PURR ($61k of new
      positions against $12k of depth).
  min_growth_to_backstop:
    value: 0.01
    unit: ratio
    basis: placeholder
    note: >-
      The new positions must also reach 1% of the backstop's capital - HLP's
      liquidator vaults ($33.0M on 2026-10-13, so $330k), or a HIP-3 dex's
      backstop liquidator. Every HIP-3 backstop held $0 to $104k that day, so on
      HIP-3 this condition nearly always holds and the depth ratio decides: any
      loss there passes straight to auto-deleveraging.
condition:
  all:
    - >-
      market.open_interest_change_usd_1h / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
      >= threshold.max_growth_to_depth
    - >-
      market.open_interest_change_usd_1h / backstop.liquidator_account_value_usd
      >= threshold.min_growth_to_backstop
report:
  growth_to_thinner_side_depth: market.open_interest_change_usd_1h / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
  growth_to_backstop_capital: market.open_interest_change_usd_1h / backstop.liquidator_account_value_usd
false_positives:
  - scenario: News or a listing elsewhere draws real two-sided interest faster than market makers deepen the book.
    distinguisher: Many unrelated accounts, depth rising over the following snapshots, and an external price move that explains the interest.
  - scenario: A market listed within the last hour or two starts from zero open interest and a thin book.
    distinguisher: Market age; compare with how other new listings filled in.
  - scenario: One large trader opens a hedged or directional position that is well collateralized.
    distinguisher: Leverage and margin of the new positions; a low-leverage position far from liquidation cannot be pushed onto the backstop cheaply.
limitations:
  - The change is net. Positions opened while others close are partly hidden, so a build-up during heavy turnover is understated.
  - A build-up spread over more than an hour can stay below the threshold in every window; open_interest_exceeds_depth catches it once the standing exposure is large.
  - No anchor's record states how long the build-up preceded the liquidation, so the lead time this rule gives is unmeasured.
  - Needs a snapshot of the same market taken 55 to 65 minutes earlier (`snapshot --previous`); without one the rule returns unknown.
  - The threshold on depth is definitional and the one on backstop capital is a placeholder; neither is calibrated, and the recording behind the base rate covers two hours of one quiet day.
fixtures:
  - name: an hour's new positions twice the thinner side fire
    expect: fires
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: 2.0e6, market.bid_depth_usd_2pct: 1.5e6, market.ask_depth_usd_2pct: 1.0e6, backstop.liquidator_account_value_usd: 33.0e6}
  - name: growth a deep book absorbs is silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: 5.0e6, market.bid_depth_usd_2pct: 50.0e6, market.ask_depth_usd_2pct: 60.0e6, backstop.liquidator_account_value_usd: 33.0e6}
  - name: growth too small to matter to the backstop is silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: 60.0e3, market.bid_depth_usd_2pct: 12.0e3, market.ask_depth_usd_2pct: 20.0e3, backstop.liquidator_account_value_usd: 33.0e6}
    note: Five times the depth, but 0.2% of the backstop's capital.
  - name: exactly at both thresholds fires
    expect: fires
    provenance: synthetic
    surface: hyperps
    values: {market.open_interest_change_usd_1h: 1.0e6, market.bid_depth_usd_2pct: 1.0e6, market.ask_depth_usd_2pct: 3.0e6, backstop.liquidator_account_value_usd: 100.0e6}
  - name: falling open interest is silent even with depth unmeasured
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_change_usd_1h: -3.0e6, backstop.liquidator_account_value_usd: 33.0e6}
  - name: an empty HIP-3 backstop makes any unabsorbable growth material
    expect: fires
    provenance: synthetic
    surface: hip3_perps
    values: {market.open_interest_change_usd_1h: 20.0e3, market.bid_depth_usd_2pct: 5.0e3, market.ask_depth_usd_2pct: 8.0e3, backstop.liquidator_account_value_usd: 0.0}
  - name: no snapshot an hour earlier is unknown
    expect: unknown
    provenance: synthetic
    surface: core_perps
    values: {market.bid_depth_usd_2pct: 1.0e6, market.ask_depth_usd_2pct: 1.0e6, backstop.liquidator_account_value_usd: 33.0e6}
  - name: outcome markets have no liquidations
    expect: not_applicable
    provenance: synthetic
    surface: hip4_outcomes
    values: {market.open_interest_change_usd_1h: 2.0e6, market.bid_depth_usd_2pct: 0.1e6, market.ask_depth_usd_2pct: 0.1e6, backstop.liquidator_account_value_usd: 1.0e6}
