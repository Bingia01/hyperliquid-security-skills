id: open_interest_exceeds_depth
title: Open interest is large relative to executable depth
summary: >-
  Measures how many times over the thinner side of the book (within 2% of mid)
  the market's open interest is. A forced close of even a fraction of open
  interest in a market where this ratio is high cannot clear on the book and
  falls to the backstop.
stage: precondition
mode: report
severity: medium
consumer: Risk analysts; HIP-3 deployers for their own markets
action: >-
  Review open interest caps and leverage for the market; for HIP-3, lower the
  cap with setOpenInterestCaps.
applies_to: [core_perps, hyperps, hip3_perps]
scope: [market]
detects: [exposure_exceeds_depth]
protects: [loss_containment]
anchors: [hl-2025-03-jelly, hl-2025-11-popcat, hl-2025-08-xpl-hyperp]
thresholds:
  max_oi_to_depth:
    value: 67.27
    unit: ratio
    basis: calibrated
    calibration: open_interest_to_depth_cross_section
    note: >-
      90th percentile across validator-operated perps of each market's median
      ratio (2026-10-13 recording): firing means "among the most exposed tenth
      of markets", a structural ranking. Open interest is never liquidated at
      once, so the ratio is a coarse proxy for liquidation overhang.
condition: >-
  market.open_interest_usd / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
  >= threshold.max_oi_to_depth
report:
  oi_to_thinner_side_depth: market.open_interest_usd / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
false_positives:
  - scenario: Large, liquid markets where open interest is mostly hedged basis trades.
    distinguisher: Check concentration - a few large directional positions matter; many offsetting ones do not.
  - scenario: Depth briefly withdrawn around a news event.
    distinguisher: Require the condition to persist across several snapshots before acting.
limitations:
  - Measures resting depth only; it cannot see hidden or quickly replenished liquidity.
  - Open interest does not say where liquidation prices sit; liquidation overhang needs node data.
fixtures:
  - name: thin market fires
    expect: fires
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_usd: 30.0e6, market.bid_depth_usd_2pct: 0.3e6, market.ask_depth_usd_2pct: 0.5e6}
  - name: deep market is silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_usd: 18.0e6, market.bid_depth_usd_2pct: 3.0e6, market.ask_depth_usd_2pct: 4.0e6}
  - name: exactly at threshold fires
    expect: fires
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_usd: 67.27e6, market.bid_depth_usd_2pct: 1.0e6, market.ask_depth_usd_2pct: 2.0e6}
  - name: an empty side counts as infinitely thin
    expect: fires
    provenance: synthetic
    surface: hip3_perps
    values: {market.open_interest_usd: 1.0e6, market.bid_depth_usd_2pct: 0.0, market.ask_depth_usd_2pct: 2.0e6}
  - name: depth not measurable means unknown, not safe
    expect: unknown
    provenance: synthetic
    surface: core_perps
    values: {market.open_interest_usd: 18.0e6, market.ask_depth_usd_2pct: 4.0e6}
  - name: not evaluated on outcome markets
    expect: not_applicable
    provenance: synthetic
    surface: hip4_outcomes
    values: {}
