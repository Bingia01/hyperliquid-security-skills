id: funded_cluster_same_direction
title: Commonly funded wallets build one-directional exposure larger than depth
summary: >-
  Capital split across freshly funded wallets evades per-account limits. When
  linked wallets hold the same side and their combined size exceeds the depth
  their liquidations would hit, they can be used to push a cascade onto the
  backstop (POPCAT, 19 wallets funded from one exchange withdrawal).
stage: precondition
mode: report
severity: high
consumer: Risk analysts; protocol risk team; HIP-3 deployers
action: Treat the cluster as one position for concentration limits; watch for walls placed near its liquidation prices.
applies_to: [core_perps, hyperps, hip3_perps]
scope: [cluster, market]
detects: [capital_sharding]
protects: [loss_containment, price_integrity]
anchors: [hl-2025-11-popcat, hl-2026-04-fartcoin]
thresholds:
  min_wallets:
    value: 3.0
    unit: count
    basis: placeholder
  min_same_direction_share:
    value: 0.8
    unit: ratio
    basis: placeholder
  max_cluster_to_depth:
    value: 1.0
    unit: ratio
    basis: placeholder
condition:
  all:
    - cluster.shared_funding_source
    - cluster.wallet_count >= threshold.min_wallets
    - cluster.same_direction_share >= threshold.min_same_direction_share
    - cluster.combined_notional_usd / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct) >= threshold.max_cluster_to_depth
report:
  wallet_count: cluster.wallet_count
  cluster_to_thinner_side_depth: cluster.combined_notional_usd / min(market.bid_depth_usd_2pct, market.ask_depth_usd_2pct)
false_positives:
  - scenario: Users of one exchange or fund withdrawing through the same hot wallet and independently taking a popular trade.
    distinguisher: Entry timing, sizing patterns and later behavior (exits together vs independently).
  - scenario: A fund operating sub-accounts openly.
    distinguisher: Known, labeled entity whose exposure is reported elsewhere.
limitations:
  - Clustering is the hard part and lives upstream; this rule only scores a cluster once found.
  - Exchange-funded clusters need off-chain attribution of withdrawal batches.
fixtures:
  - name: sharded one-sided cluster fires
    expect: fires
    provenance: synthetic
    surface: core_perps
    values: {cluster.shared_funding_source: true, cluster.wallet_count: 19.0, cluster.same_direction_share: 1.0, cluster.combined_notional_usd: 25.0e6, market.bid_depth_usd_2pct: 2.0e6, market.ask_depth_usd_2pct: 3.0e6}
  - name: independently funded wallets are silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {cluster.shared_funding_source: false, cluster.wallet_count: 19.0, cluster.same_direction_share: 1.0, cluster.combined_notional_usd: 25.0e6, market.bid_depth_usd_2pct: 2.0e6, market.ask_depth_usd_2pct: 3.0e6}
  - name: missing depth but a false conjunct is still silent
    expect: silent
    provenance: synthetic
    surface: core_perps
    values: {cluster.shared_funding_source: true, cluster.wallet_count: 2.0, cluster.same_direction_share: 1.0, cluster.combined_notional_usd: 25.0e6}
  - name: missing depth otherwise is unknown
    expect: unknown
    provenance: synthetic
    surface: core_perps
    values: {cluster.shared_funding_source: true, cluster.wallet_count: 19.0, cluster.same_direction_share: 1.0, cluster.combined_notional_usd: 25.0e6}
