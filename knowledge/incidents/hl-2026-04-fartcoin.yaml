id: hl-2026-04-fartcoin
title: FARTCOIN longs from four wallets pumped and liquidated onto HLP
period: {start: 2026-04-09, end: 2026-04-09}
summary: >-
  About $15M of FARTCOIN longs across four wallets were pumped about 25% and
  then liquidated into thin liquidity, costing HLP about $1.5M by PeckShield's
  estimate, with auto-deleveraging paying about $849K to shorts. Single news
  source; kept as a research lead.
