id: open_interest_to_depth_cross_section
computed: '2026-10-15'
method: For every listed market, the median over the recording of the rule's own ratio (open interest
  / thinner side's resting depth within 2% of mid from l2Book, escalating nSigFigs until 20 levels reach
  the band edge (rows where no aggregation covered the band are excluded)). Threshold = 90th percentile
  of those medians across markets of the surface, so the rule marks the most exposed tenth of markets.
  The percentile is a policy choice for an attention list, not a statistical optimum.
data: 'Live public API recording of every listed perp: 2026-10-14T01:02 to 2026-10-15T01:08 UTC, 145 passes.'
limitations:
- One recording window in one market regime; stress regimes are absent.
- Hyperps cannot be told apart from validator-operated perps in the API and are pooled into core_perps.
- Archived order books (Hyperliquid S3, Tardis) store 20 levels at full precision; on 2025-11-01 BTC's
  20 levels never reached the 2% band (0 of 157,225 snapshots), so historical depth cannot be measured
  this way for liquid markets.
targets:
- rule: open_interest_exceeds_depth
  threshold: max_oi_to_depth
  surface: core_perps
  applies_as: rule_default
  value: 68.87
- rule: open_interest_exceeds_depth
  threshold: max_oi_to_depth
  surface: hip3_perps
  applies_as: profile_override
  value: 31.04
checks:
- description: 'JELLY, 25 days before the attack (2025-03-01): Tardis free dataset hyperliquid book_snapshot_25
    and derivative_ticker, JELLY 2025-03-01; 20 levels spanned a median 0.72% of price, so 2% depth is
    only bounded; open interest median $1,018,502; ratio upper bound median 33.7, p90 52.4 over 146665
    snapshots'
  outcome: would not have fired (even the upper bound is below the threshold); core_perps threshold 68.87
- description: 'POPCAT, 11 days before the attack (2025-11-01): Tardis free dataset hyperliquid book_snapshot_25
    and derivative_ticker, POPCAT 2025-11-01; 20 levels spanned a median 0.17% of price, so 2% depth is
    only bounded; open interest median $3,706,777; ratio upper bound median 68.4, p90 109.0 over 133841
    snapshots'
  outcome: would not have fired (even the upper bound is below the threshold); core_perps threshold 68.87
