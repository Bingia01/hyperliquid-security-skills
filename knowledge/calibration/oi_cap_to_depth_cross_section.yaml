id: oi_cap_to_depth_cross_section
computed: '2026-10-13'
method: 'For every HIP-3 market with a published cap, the median over the recording of the cap / thinner
  side''s resting depth within 2% of mid from l2Book, escalating nSigFigs until 20 levels reach the band
  edge (rows where no aggregation covered the band are excluded). Threshold = 90th percentile across markets
  (policy choice: the most generously capped tenth relative to depth).'
data: 'Live public API recording of every listed HIP-3 perp: 2026-10-13T06:24 to 2026-10-13T08:20 UTC,
  12 passes.'
limitations:
- One recording window; caps are configuration and change by deployer action.
